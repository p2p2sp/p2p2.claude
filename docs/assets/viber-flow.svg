<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1852" width="1200" height="1852" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">viber - from an idea to committed code</title>
  <desc id="svgDesc">Flow diagram of the viber plugin: one-time setup, the two entries (an idea through the idea interview, a bug through the fixer diagnosis), the planner writing the plan and the planner-review agent gating it, the approval gate you pass yourself, then the implementor building the plan task by task - task-coder, task-reviewer and one commit per task - followed by the full test suite, the optional memory, rules and QA close, and the later e2e pass that turns the QA scenarios into Playwright tests.</desc>

  <style>
    :root {
      --bg:#ffffff; --panel:#ffffff; --panel2:#f6f8fa; --border:#d1d9e0;
      --text:#1f2328; --muted:#59636e;
      --idea:#0969da; --fix:#cf222e; --build:#8250df; --ok:#1a7f37; --amber:#9a6700;
      --ok-bg:#dafbe1; --build-bg:#fbefff; --amber-bg:#fff8c5; --chip:#f6f8fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0d1117; --panel:#161b22; --panel2:#11161d; --border:#30363d;
        --text:#e6edf3; --muted:#9198a1;
        --idea:#58a6ff; --fix:#f85149; --build:#a371f7; --ok:#3fb950; --amber:#d29922;
        --ok-bg:#0f2a17; --build-bg:#21173a; --amber-bg:#2d2410; --chip:#1c2128;
      }
    }

    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); }
    .h1 { font-size: 21px; font-weight: 700; }
    .title { font-size: 17px; font-weight: 700; }
    .desc { font-size: 13.5px; fill: var(--muted); }
    .desc-s { font-size: 12.5px; fill: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: var(--idea); }
    .mono-t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; font-weight: 700; fill: var(--text); }
    .badge-t { font-size: 11.5px; font-weight: 600; fill: var(--muted); }
    .lbl { font-size: 12.5px; font-weight: 600; fill: var(--muted); }
    .hdr-t { font-size: 14.5px; font-weight: 700; }
    .kicker { font-size: 12.5px; font-weight: 700; fill: var(--muted); letter-spacing: .06em; }

    .node { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .agent { stroke-dasharray: 2 3; stroke-width: 2; }
    .badge { fill: var(--chip); stroke: var(--border); stroke-width: 1; }
    .pane { fill: var(--panel2); stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 5 5; }

    .link { fill: none; stroke-width: 1.6; stroke-opacity: .5; }
    .flow { fill: none; stroke-width: 2; stroke-opacity: .95; stroke-dasharray: 9 7; animation: dash 1.3s linear infinite; }
    @keyframes dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -16; } }

    .l-n { stroke: var(--muted); } .mk-n { fill: var(--muted); }
    .l-i { stroke: var(--idea); }  .mk-i { fill: var(--idea); }
    .l-f { stroke: var(--fix); }   .mk-f { fill: var(--fix); }
    .l-b { stroke: var(--build); } .mk-b { fill: var(--build); }
    .l-o { stroke: var(--ok); }    .mk-o { fill: var(--ok); }
    .l-a { stroke: var(--amber); } .mk-a { fill: var(--amber); }

    .ring-a { fill: none; stroke: var(--amber); animation: ring 2.6s ease-in-out infinite; }
    @keyframes ring {
      0%, 100% { stroke-width: 1.5; stroke-opacity: .22; }
      50%      { stroke-width: 5;   stroke-opacity: .5; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; }
      .ring-a { animation: none; stroke-width: 2; stroke-opacity: .35; }
    }
  </style>

  <defs>
    <marker id="ar-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-n"/></marker>
    <marker id="ar-i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-i"/></marker>
    <marker id="ar-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-f"/></marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-b"/></marker>
    <marker id="ar-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-o"/></marker>
    <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-a"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1852" fill="var(--bg)"/>

  <!-- ============ HEADER + LEGEND ============ -->
  <text x="40" y="42" class="kicker">VIBER</text>
  <text x="40" y="72" class="h1">From an idea to committed code</text>

  <rect x="760" y="26" width="30" height="16" rx="5" class="node"/>
  <text x="800" y="39" class="desc">skill - runs in your own session</text>
  <rect x="760" y="52" width="30" height="16" rx="5" class="node agent"/>
  <text x="800" y="65" class="desc">agent - its own fresh context</text>
  <rect x="760" y="78" width="30" height="16" rx="8" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="1.5"/>
  <text x="800" y="91" class="desc">gate - waits for your decision</text>

  <!-- ============ SETUP ============ -->
  <rect x="40" y="112" width="1120" height="60" rx="12" class="node"/>
  <rect x="40" y="112" width="4" height="60" rx="2" fill="var(--muted)"/>
  <rect x="1082" y="122" width="58" height="16" rx="8" class="badge"/>
  <text x="1111" y="134" class="badge-t" text-anchor="middle">skill</text>
  <text x="66" y="148" class="mono-t">/viber:setup</text>
  <text x="200" y="148" class="desc">once per project - the switches, the .gitignore rule, the recommended permissions</text>

  <!-- ============ ENTRY: IDEA ============ -->
  <rect x="40" y="200" width="520" height="48" rx="24" fill="var(--chip)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="300" y="230" class="title" text-anchor="middle" style="font-size:15px">New idea · feature · change to something existing</text>

  <path d="M300 248 L300 282" class="link l-i" marker-end="url(#ar-i)"/>
  <path d="M300 248 L300 282" class="flow l-i"/>

  <rect x="40" y="286" width="520" height="118" rx="10" class="node"/>
  <rect x="40" y="286" width="4" height="118" rx="2" fill="var(--idea)"/>
  <rect x="478" y="296" width="58" height="16" rx="8" class="badge"/>
  <text x="507" y="308" class="badge-t" text-anchor="middle">skill</text>
  <text x="64" y="326" class="mono-t">/viber:idea</text>
  <text x="64" y="352" class="desc">One question at a time, with options and a recommendation.</text>
  <text x="64" y="370" class="desc">Too big for one cycle? Split into ordered parts, first part only.</text>
  <text x="64" y="388" class="desc">Writes nothing - it ends in a summary you confirm.</text>

  <!-- ============ ENTRY: BUG ============ -->
  <rect x="640" y="200" width="520" height="48" rx="24" fill="var(--chip)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="900" y="230" class="title" text-anchor="middle" style="font-size:15px">Bug · regression · wrong behaviour</text>

  <path d="M900 248 L900 282" class="link l-f" marker-end="url(#ar-f)"/>
  <path d="M900 248 L900 282" class="flow l-f"/>

  <rect x="640" y="286" width="520" height="118" rx="10" class="node"/>
  <rect x="640" y="286" width="4" height="118" rx="2" fill="var(--fix)"/>
  <rect x="1078" y="296" width="58" height="16" rx="8" class="badge"/>
  <text x="1107" y="308" class="badge-t" text-anchor="middle">skill</text>
  <text x="664" y="326" class="mono-t">/viber:fixer</text>
  <text x="664" y="352" class="desc">Traces the bug to its root cause - no guessing.</text>
  <text x="664" y="370" class="desc">Proves it with a failing test, left RED in your tree.</text>
  <text x="664" y="388" class="desc">Never fixes it here - it hands over a proven fix plan.</text>

  <!-- ============ CONVERGE ON THE PLANNER ============ -->
  <path d="M300 404 L300 432 Q300 450 318 450 L600 450" class="link l-i"/>
  <path d="M300 404 L300 432 Q300 450 318 450 L600 450" class="flow l-i"/>
  <text x="459" y="444" class="lbl" text-anchor="middle">the summary you confirmed</text>

  <path d="M900 404 L900 432 Q900 450 882 450 L600 450" class="link l-f"/>
  <path d="M900 404 L900 432 Q900 450 882 450 L600 450" class="flow l-f"/>
  <text x="741" y="444" class="lbl" text-anchor="middle">the diagnosis and its failing test</text>

  <path d="M600 450 L600 478" class="link l-n" marker-end="url(#ar-n)"/>
  <path d="M600 450 L600 478" class="flow l-n"/>

  <rect x="290" y="482" width="620" height="112" rx="10" class="node"/>
  <rect x="290" y="482" width="4" height="112" rx="2" fill="var(--idea)"/>
  <rect x="842" y="492" width="58" height="16" rx="8" class="badge"/>
  <text x="871" y="504" class="badge-t" text-anchor="middle">skill</text>
  <text x="314" y="512" class="mono-t">planner</text>
  <text x="314" y="538" class="desc">Writes the plan in plan mode, against your actual codebase.</text>
  <text x="314" y="556" class="desc">Every task names the files it touches and how it is verified.</text>
  <text x="314" y="578" class="mono">one plan · numbered tasks · acceptance criteria</text>

  <path d="M600 594 L600 622" class="link l-n" marker-end="url(#ar-n)"/>
  <path d="M600 594 L600 622" class="flow l-n"/>

  <rect x="290" y="626" width="620" height="88" rx="10" class="node agent"/>
  <rect x="842" y="636" width="58" height="16" rx="8" class="badge"/>
  <text x="871" y="648" class="badge-t" text-anchor="middle">agent</text>
  <text x="314" y="656" class="mono-t">planner-review</text>
  <text x="314" y="678" class="desc">Reads the plan against the codebase before you ever see it.</text>
  <text x="314" y="698" class="desc-s">PASS or FAIL - a FAIL sends the plan back for another round</text>

  <path d="M910 670 L942 670 Q960 670 960 652 L960 556 Q960 538 942 538 L914 538" class="link l-i" marker-end="url(#ar-i)"/>
  <path d="M910 670 L942 670 Q960 670 960 652 L960 556 Q960 538 942 538 L914 538" class="flow l-i"/>
  <text x="978" y="604" class="lbl" text-anchor="middle" transform="rotate(-90 978 604)">FAIL → revise</text>

  <path d="M600 714 L600 742" class="link l-a" marker-end="url(#ar-a)"/>
  <path d="M600 714 L600 742" class="flow l-a"/>

  <!-- ============ GATE ============ -->
  <rect x="286" y="742" width="628" height="64" rx="32" class="ring-a"/>
  <rect x="290" y="746" width="620" height="56" rx="28" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="1.5"/>
  <text x="600" y="770" class="title" text-anchor="middle" style="font-size:14.5px">GATE - you approve the plan</text>
  <text x="600" y="788" class="desc-s" text-anchor="middle">nothing is written before this · a plan that failed review cannot leave plan mode</text>

  <path d="M600 806 L600 838" class="link l-b" marker-end="url(#ar-b)"/>
  <path d="M600 806 L600 838" class="flow l-b"/>

  <!-- ============ BUILD ============ -->
  <rect x="330" y="842" width="540" height="42" rx="21" fill="var(--build-bg)" stroke="var(--build)" stroke-width="1.5"/>
  <text x="600" y="868" class="hdr-t" text-anchor="middle" fill="var(--build)">BUILD - the approved plan, task by task</text>

  <path d="M600 884 L600 908" class="link l-b" marker-end="url(#ar-b)"/>
  <path d="M600 884 L600 908" class="flow l-b"/>

  <rect x="290" y="912" width="620" height="112" rx="10" class="node"/>
  <rect x="290" y="912" width="4" height="112" rx="2" fill="var(--build)"/>
  <rect x="842" y="922" width="58" height="16" rx="8" class="badge"/>
  <text x="871" y="934" class="badge-t" text-anchor="middle">skill</text>
  <text x="314" y="942" class="mono-t">implementor</text>
  <text x="314" y="968" class="desc">Lands the plan in your repo and splits it into one file per task.</text>
  <text x="314" y="986" class="desc">Dispatches the work - it never reads or writes code itself.</text>
  <text x="314" y="1008" class="mono">docs/_specs/&lt;date&gt;_&lt;slug&gt;/</text>

  <path d="M600 1024 L600 1056" class="link l-b" marker-end="url(#ar-b)"/>
  <path d="M600 1024 L600 1056" class="flow l-b"/>

  <rect x="240" y="1060" width="720" height="360" rx="14" class="pane"/>
  <rect x="264" y="1048" width="176" height="24" rx="12" fill="var(--panel)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="352" y="1064" class="kicker" text-anchor="middle">FOR EVERY TASK</text>

  <rect x="340" y="1088" width="520" height="96" rx="10" class="node agent"/>
  <rect x="792" y="1098" width="58" height="16" rx="8" class="badge"/>
  <text x="821" y="1110" class="badge-t" text-anchor="middle">agent</text>
  <text x="364" y="1118" class="mono-t">task-coder</text>
  <text x="364" y="1140" class="desc">Builds one task and proves it green.</text>
  <text x="364" y="1160" class="desc-s">sees only its own task file, so it cannot drift into another task's files</text>

  <path d="M600 1184 L600 1212" class="link l-b" marker-end="url(#ar-b)"/>
  <path d="M600 1184 L600 1212" class="flow l-b"/>

  <rect x="340" y="1216" width="520" height="92" rx="10" class="node agent"/>
  <rect x="792" y="1226" width="58" height="16" rx="8" class="badge"/>
  <text x="821" y="1238" class="badge-t" text-anchor="middle">agent</text>
  <text x="364" y="1246" class="mono-t">task-reviewer</text>
  <text x="364" y="1268" class="desc">Checks the task against what the plan said it must do.</text>
  <text x="364" y="1288" class="desc-s">a finding goes straight back to the coder, then it is reviewed again</text>

  <path d="M860 1262 L892 1262 Q910 1262 910 1244 L910 1154 Q910 1136 892 1136 L864 1136" class="link l-f" marker-end="url(#ar-f)"/>
  <path d="M860 1262 L892 1262 Q910 1262 910 1244 L910 1154 Q910 1136 892 1136 L864 1136" class="flow l-f"/>
  <text x="930" y="1200" class="lbl" text-anchor="middle" transform="rotate(-90 930 1200)">FAIL → fix</text>

  <path d="M600 1308 L600 1336" class="link l-b" marker-end="url(#ar-b)"/>
  <path d="M600 1308 L600 1336" class="flow l-b"/>

  <rect x="340" y="1340" width="520" height="58" rx="10" fill="var(--ok-bg)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="600" y="1364" class="title" text-anchor="middle" style="font-size:14.5px" fill="var(--ok)">commit - one task, one commit</text>
  <text x="600" y="1384" class="desc-s" text-anchor="middle">the subject comes from the plan · only that task's files are staged</text>

  <path d="M340 1369 L308 1369 Q290 1369 290 1351 L290 1154 Q290 1136 308 1136 L336 1136" class="link l-o" marker-end="url(#ar-o)"/>
  <path d="M340 1369 L308 1369 Q290 1369 290 1351 L290 1154 Q290 1136 308 1136 L336 1136" class="flow l-o"/>
  <text x="272" y="1250" class="lbl" text-anchor="middle" transform="rotate(-90 272 1250)">next task</text>

  <path d="M600 1398 L600 1456" class="link l-n" marker-end="url(#ar-n)"/>
  <path d="M600 1398 L600 1456" class="flow l-n"/>
  <text x="616" y="1440" class="lbl">when every task is done</text>

  <!-- ============ CLOSE ============ -->
  <rect x="340" y="1460" width="520" height="90" rx="10" class="node agent"/>
  <rect x="792" y="1470" width="58" height="16" rx="8" class="badge"/>
  <text x="821" y="1482" class="badge-t" text-anchor="middle">agent</text>
  <text x="364" y="1490" class="mono-t">test-runner</text>
  <text x="364" y="1512" class="desc">Runs the whole build and test suite once.</text>
  <text x="364" y="1532" class="desc-s">a regression here is fixed and committed before the run closes</text>

  <path d="M600 1550 L600 1568" class="link l-n"/>
  <path d="M600 1550 L600 1568" class="flow l-n"/>
  <path d="M240 1568 L960 1568" class="link l-n"/>
  <text x="616" y="1560" class="lbl">only the switches you turned on</text>

  <path d="M240 1568 L240 1594" class="link l-n" marker-end="url(#ar-n)"/>
  <path d="M600 1568 L600 1594" class="link l-n" marker-end="url(#ar-n)"/>
  <path d="M960 1568 L960 1594" class="link l-n" marker-end="url(#ar-n)"/>

  <rect x="70" y="1598" width="340" height="96" rx="10" class="node agent"/>
  <rect x="328" y="1608" width="58" height="16" rx="8" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="1"/>
  <text x="357" y="1620" class="badge-t" text-anchor="middle" fill="var(--amber)">optional</text>
  <text x="94" y="1628" class="mono-t">memory</text>
  <text x="94" y="1650" class="desc">Your CLAUDE.md learns what the build taught.</text>
  <text x="94" y="1672" class="mono">viber.yml: memory</text>

  <rect x="430" y="1598" width="340" height="96" rx="10" class="node agent"/>
  <rect x="688" y="1608" width="58" height="16" rx="8" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="1"/>
  <text x="717" y="1620" class="badge-t" text-anchor="middle" fill="var(--amber)">optional</text>
  <text x="454" y="1628" class="mono-t">rules</text>
  <text x="454" y="1650" class="desc">Confirmed conventions land in .claude/rules/.</text>
  <text x="454" y="1672" class="mono">viber.yml: rules</text>

  <rect x="790" y="1598" width="340" height="96" rx="10" class="node agent"/>
  <rect x="1048" y="1608" width="58" height="16" rx="8" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="1"/>
  <text x="1077" y="1620" class="badge-t" text-anchor="middle" fill="var(--amber)">optional</text>
  <text x="814" y="1628" class="mono-t">qa</text>
  <text x="814" y="1650" class="desc">Test scenarios for what was actually delivered.</text>
  <text x="814" y="1672" class="mono">viber.yml: qa</text>

  <!-- ============ E2E ============ -->
  <path d="M960 1694 L960 1746 Q960 1764 942 1764 L864 1764" class="link l-n" marker-end="url(#ar-n)"/>
  <path d="M960 1694 L960 1746 Q960 1764 942 1764 L864 1764" class="flow l-n"/>
  <text x="976" y="1722" class="lbl">later, when you want them automated</text>

  <rect x="340" y="1716" width="520" height="96" rx="10" class="node"/>
  <rect x="340" y="1716" width="4" height="96" rx="2" fill="var(--ok)"/>
  <rect x="792" y="1726" width="58" height="16" rx="8" class="badge"/>
  <text x="821" y="1738" class="badge-t" text-anchor="middle">skill</text>
  <text x="364" y="1746" class="mono-t">/viber:e2e</text>
  <text x="364" y="1768" class="desc">Turns those scenarios into Playwright tests.</text>
  <text x="364" y="1788" class="desc-s">runs them against your application and commits the ones that pass</text>
</svg>
