# .superdev/config.yml — superdev opt-in switches (managed by /superdev:setup)
# A missing file or key = enabled (fail-open). Flip a value to `false` to disable that area.
adr:            true   # ADR capture — orchestrator runs dev-agent-adr-recorder
rules_improver: true   # auto-promote review learnings → .claude/rules/ (dev-agent-improver step)
# rule_extensions is appended automatically on the first `mem-rules` run.
