$description: "Design tokens extracted from <project> mockups (DTCG 2025.10)"

# ============================================================
# COLOR  — primitives (ramps) + semantic roles, all under `color`
# so leaf names stay short: --color-bg, --color-accent, --color-brand-500 …
# ============================================================
color:
  $type: color

  # --- primitives: neutral ramp ---
  gray:
    "50":  { $value: { colorSpace: srgb, components: [0.98, 0.98, 0.98], hex: "#fafafa" } }
    "100": { $value: { colorSpace: srgb, components: [0.96, 0.96, 0.97], hex: "#f4f4f5" } }
    "200": { $value: { colorSpace: srgb, components: [0.90, 0.90, 0.92], hex: "#e5e5ea" } }
    "500": { $value: { colorSpace: srgb, components: [0.45, 0.45, 0.50], hex: "#737380" } }
    "700": { $value: { colorSpace: srgb, components: [0.25, 0.25, 0.29], hex: "#3f3f49" } }
    "900": { $value: { colorSpace: srgb, components: [0.09, 0.09, 0.11], hex: "#17171c" } }
  brand:
    "500": { $value: { colorSpace: srgb, components: [0.20, 0.40, 0.95], hex: "#3366f2" } }
    "600": { $value: { colorSpace: srgb, components: [0.16, 0.32, 0.80], hex: "#2952cc" } }
  white: { $value: { colorSpace: srgb, components: [1, 1, 1], hex: "#ffffff" } }

  # --- semantic roles: aliases into the primitives above ---
  bg:        { $value: "{color.gray.50}" }    # -> --color-bg   -> bg-bg
  surface:   { $value: "{color.white}" }      # -> --color-surface
  fg:        { $value: "{color.gray.900}" }   # -> --color-fg   -> text-fg
  muted:     { $value: "{color.gray.500}" }
  border:    { $value: "{color.gray.200}" }   # -> border-border
  accent:    { $value: "{color.brand.500}" }
  accent-fg: { $value: "{color.white}" }

font:
  family:
    $type: fontFamily
    sans: { $value: ["Inter", "system-ui", "sans-serif"] }   # -> --font-sans
    mono: { $value: ["ui-monospace", "monospace"] }
  weight:
    $type: fontWeight
    regular:  { $value: 400 }       # -> --font-weight-regular
    medium:   { $value: 500 }
    semibold: { $value: 600 }

dimension:
  font-size:
    $type: dimension
    "300": { $value: { value: 14, unit: px } }   # -> --text-300 -> text-300
    "400": { $value: { value: 16, unit: px } }
    "600": { $value: { value: 20, unit: px } }
    "800": { $value: { value: 28, unit: px } }

spacing:
  $type: dimension
  "1": { $value: { value: 4,  unit: px } }       # -> --spacing-1 -> p-1, gap-1 …
  "2": { $value: { value: 8,  unit: px } }
  "3": { $value: { value: 12, unit: px } }
  "4": { $value: { value: 16, unit: px } }
  "6": { $value: { value: 24, unit: px } }
  "8": { $value: { value: 32, unit: px } }

radius:
  $type: dimension
  control: { $value: { value: 8,    unit: px } } # -> --radius-control -> rounded-control
  card:    { $value: { value: 12,   unit: px } }
  full:    { $value: { value: 9999, unit: px } }

border-width:
  $type: dimension
  hairline: { $value: { value: 1, unit: px } }

shadow:
  $type: shadow
  card:
    $value:
      - color: { colorSpace: srgb, components: [0, 0, 0], alpha: 0.06, hex: "#000000" }
        offsetX: { value: 0, unit: px }
        offsetY: { value: 1, unit: px }
        blur:    { value: 3, unit: px }
        spread:  { value: 0, unit: px }
  overlay:
    $value:
      - color: { colorSpace: srgb, components: [0, 0, 0], alpha: 0.18, hex: "#000000" }
        offsetX: { value: 0,  unit: px }
        offsetY: { value: 10, unit: px }
        blur:    { value: 30, unit: px }
        spread:  { value: 0,  unit: px }

motion:
  duration:
    $type: duration
    fast: { $value: { value: 150, unit: ms } }
  ease:
    $type: cubicBezier
    standard: { $value: [0.4, 0, 0.2, 1] }       # -> --ease-standard

breakpoint:
  $type: dimension
  md: { $value: { value: 48, unit: rem } }        # -> --breakpoint-md
  lg: { $value: { value: 64, unit: rem } }

zindex:
  $type: number
  sidebar: { $value: 10 }                          # -> plain --zindex-sidebar
  panel:   { $value: 20 }
  modal:   { $value: 50 }

# Composite text styles (emitted as comments by the converter; parts already
# exist as tokens above, so use them directly in markup).
typography:
  $type: typography
  heading-1:
    $value:
      fontFamily: "{font.family.sans}"
      fontSize: "{dimension.font-size.800}"
      fontWeight: "{font.weight.semibold}"
      lineHeight: 1.2
  body:
    $value:
      fontFamily: "{font.family.sans}"
      fontSize: "{dimension.font-size.400}"
      fontWeight: "{font.weight.regular}"
      lineHeight: 1.5
