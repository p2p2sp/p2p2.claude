name: "✨ Feature Request"
description: "An idea for a new feature or a change to an existing one"
type: "Feature"
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - viber
        - superui
        - superbiz
        - supercc
        - a new plugin
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What gets in your way today, and when it happens.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: How it should work from your side. No implementation details needed.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Examples, screenshots, what the idea deliberately leaves out.
