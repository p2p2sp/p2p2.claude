name: "🐛 Bug Report"
description: "Something in a plugin does not work as described"
type: "Bug"
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - viber
        - superui
        - superbiz
        - supercc
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Shown by `/plugin` in Claude Code.
      placeholder: "0.78.1"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command or prompt you used, and what the plugin did.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `/viber:setup` in an empty repository
        2. Run `/viber:intent` and answer the first question
        3. ...

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Claude Code version, model, anything else that may matter.
