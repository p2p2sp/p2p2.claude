name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  Tests:
    strategy:
      fail-fast: false
      # Automatic runs (push / pull_request) only cover Linux - the cheap,
      # fastest lane. The full cross-OS matrix (macOS + Windows, where the
      # shell-portability and path-separator assumptions actually get
      # exercised) runs on a manual dispatch of this workflow.
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Guard - test glob must match at least one file
        run: |
          count=$(git ls-files 'tests/**/*.test.ts' | wc -l)
          [ "$count" -gt 0 ]
      # --test-concurrency: the suite spends its time waiting on spawned
      # scripts, not on CPU, so it runs more files at once than the runner has
      # cores. Matters on windows-latest (4 vCPU, default concurrency 3), where
      # process creation is an order of magnitude dearer than on Linux/macOS.
      # CI=true turns on the full shell matrix (tests/harness/shells.ts): every
      # POSIX shell and every bash major present, which a local run skips.
      - name: Run tests
        env:
          CI: "true"
        run: node --test --test-concurrency=12 "tests/**/*.test.ts"
