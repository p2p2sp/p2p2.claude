name: Tests
on:
  push:
  pull_request:
defaults:
  run:
    shell: bash
jobs:
  Tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Guard - test glob must match at least one file
        run: |
          count=$(git ls-files 'tests/**/*.test.ts' | wc -l)
          [ "$count" -gt 0 ]
      - name: Run tests
        run: node --test "tests/**/*.test.ts"
