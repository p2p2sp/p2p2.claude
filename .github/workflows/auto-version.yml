name: Auto patch version
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: versioning
  cancel-in-progress: false
jobs:
  bump:
    # Skip the workflow's own bump commits — replaces the [skip ci] token,
    # preventing an infinite version-bump loop (keep the prefix in sync with
    # the commit subject in .github/scripts/release.sh).
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(bump)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: Bump patch + create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release.sh patch
