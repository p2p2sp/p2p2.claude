name: Release
on:
  workflow_dispatch:
    inputs:
      part:
        description: Which version part to bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
permissions:
  contents: write
concurrency:
  group: versioning
  cancel-in-progress: false
jobs:
  Release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Bump version + create release
        id: bump
        env:
          PART: ${{ inputs.part }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release.sh "$PART"
      - name: Job summary
        run: echo "${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
