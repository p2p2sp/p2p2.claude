# viber switches. Only `true` counts as on; a key removed from this file is off.

# idea weighs whether the change carries an architectural decision worth keeping,
# and planner turns each accepted one into a first task writing docs/adr/.
adr: true

# implementor updates the project's CLAUDE.md nodes at the close of a build.
memory: true

# implementor updates .claude/rules/ at the close of a build.
rules: true

# implementor writes the build's QA scenarios at the close: an acceptance
# document a person performs and a handoff file /viber:e2e turns into tests.
qa: false

# implementor ends the build by noting on the specification whatever the build
# delivered that it does not promise, then moving the run's lasting work into
# the archive below and dropping the plan, the state file and the trail - git
# keeps them.
cleanup: true

# The two directories under docs/: where an open run lives, and where the
# archive of a finished one lands. Directory NAMES, not paths - a value with a
# slash in it is ignored and the default stands. Both are read only from inside
# this group.
directories:
  runs: _specs
  specifications: specs
