<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root{--bg:#fbfaf7;--fg:#1f1f1f;--muted:#6b6b6b;--line:#e3dfd6;--card:#fff;--accent:#2f5d50;
        --go:#2e7d32;--pivot:#b26a00;--nogo:#b3261e;--warn-bg:#fff4e5;--warn-fg:#8a4b00;
        --hi:#2e7d32;--md:#b26a00;--lo:#b3261e;--radar:#2f5d50}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg)}
  main{max-width:1080px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:28px;margin:0 0 4px}
  h2{font-size:20px;margin:0;padding:0}
  h3{font-size:16px;margin:18px 0 6px}
  h4{font-size:14px;margin:12px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  p{margin:6px 0}
  a{color:var(--accent)}
  .muted{color:var(--muted)}
  .header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:24px}
  .badge{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:700;color:#fff;font-size:15px}
  .badge.go{background:var(--go)} .badge.pivot{background:var(--pivot)} .badge.nogo{background:var(--nogo)}
  .banner{background:var(--warn-bg);color:var(--warn-fg);border:1px solid #f0c98a;border-radius:8px;padding:10px 14px;margin:12px 0}
  section.block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:14px 0}
  section.block>summary,details.sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
  details.sec[open]>summary::before{transform:rotate(90deg)}
  details.inner{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:#fcfcfb}
  details.inner>summary{cursor:pointer;font-weight:600}
  table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}
  th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
  th{background:#f3f1ec;font-weight:600}
  td.num{text-align:center;white-space:nowrap}
  .conf{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
  .conf.high{background:var(--hi)} .conf.medium{background:var(--md)} .conf.low{background:var(--lo)}
  .grid{display:grid;gap:12px}
  .grid.two{grid-template-columns:1fr 1fr}
  .grid.canvas{grid-template-columns:repeat(5,1fr);grid-template-rows:auto auto auto}
  @media(max-width:760px){.grid.two,.grid.canvas{grid-template-columns:1fr}}
  .cell{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fcfcfb;min-height:90px;white-space:pre-line}
  .cell b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
  .canvas .c1{grid-column:1;grid-row:1/3}.canvas .c2{grid-column:2;grid-row:1}.canvas .c3{grid-column:3;grid-row:1/3}
  .canvas .c4{grid-column:4;grid-row:1}.canvas .c5{grid-column:5;grid-row:1/3}.canvas .c6{grid-column:2;grid-row:2}
  .canvas .c7{grid-column:4;grid-row:2}.canvas .c8{grid-column:1/4;grid-row:3}.canvas .c9{grid-column:4/6;grid-row:3}
  .toolbar{display:flex;gap:8px;margin:8px 0 16px}
  button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
  ul{margin:6px 0;padding-left:20px}
  .radar{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
  .radar svg{width:340px;height:340px;flex:none}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:8px 0}
  .kv b{color:var(--muted);font-weight:600}
  .quote{border-left:3px solid var(--line);padding:4px 10px;margin:6px 0;font-style:italic}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted);margin-left:6px}
  .thr td:first-child{font-weight:700;white-space:nowrap}
  .thr tr.go td:first-child{color:var(--go)} .thr tr.pivot td:first-child{color:var(--pivot)} .thr tr.nogo td:first-child{color:var(--nogo)}
  footer{margin-top:40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}
  @media print{details.sec{open:true}details>summary::before{display:none}section.block{break-inside:avoid;border:none;padding:0}button,.toolbar{display:none}}
</style>
</head>
<body>
<main id="app"></main>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('report-data').textContent);
  const L = Object.assign({}, D.__default_labels || {}, D.labels || {});
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const link = (t,u) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>` : esc(t);
  const li = arr => (arr||[]).length ? '<ul>' + arr.map(x => `<li>${typeof x==='string'?esc(x):esc(x.text||'')}${x.url?' - '+link('↗',x.url):''}${x.outdated?`<span class="tag">${esc(L.outdated)}</span>`:''}</li>`).join('') + '</ul>' : `<p class="muted">-</p>`;
  const conf = c => `<span class="conf ${esc(c)}">${esc(c)}</span>`;
  const verdictClass = v => ({'Go':'go','Pivot':'pivot','No-Go':'nogo'})[v] || 'pivot';
  const table = (heads, rows) => rows.length ? `<table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>` : `<p class="muted">-</p>`;
  const sec = (title, body, open=true) => `<details class="sec block" ${open?'open':''}><summary><h2>${esc(title)}</h2></summary><div>${body}</div></details>`;
  const inner = (title, body, open=false) => `<details class="inner" ${open?'open':''}><summary>${title}</summary><div>${body}</div></details>`;
  const fco = r => `<h4>${esc(L.facts)}</h4>${li(r.facts)}<h4>${esc(L.conclusions)}</h4>${li(r.conclusions)}<h4>${esc(L.open)}</h4>${li(r.open)}`;

  // --- radar chart (inline SVG) ---
  function radar(dims){
    const n = dims.length, cx=170, cy=170, R=120;
    const pt = (i,r) => { const a = -Math.PI/2 + i*2*Math.PI/n; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
    let s = `<svg viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg" role="img">`;
    for (let k=1;k<=5;k++){ s += `<polygon fill="none" stroke="#ddd" points="${dims.map((_,i)=>pt(i,R*k/5).join(',')).join(' ')}"/>`; }
    dims.forEach((_,i)=>{ const [x,y]=pt(i,R); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#ddd"/>`; });
    s += `<polygon fill="var(--radar)" fill-opacity=".25" stroke="var(--radar)" stroke-width="2" points="${dims.map((d,i)=>pt(i,R*(d.score||0)/5).join(',')).join(' ')}"/>`;
    dims.forEach((d,i)=>{ const [x,y]=pt(i,R+22); const anchor = Math.abs(x-cx)<10?'middle':(x<cx?'end':'start'); s += `<text x="${x}" y="${y}" font-size="11" text-anchor="${anchor}" dominant-baseline="middle" fill="#444">${esc(d.name)} (${d.score})</text>`; });
    return s + '</svg>';
  }

  // --- header ---
  const V = D.verdict, M = D.meta;
  let html = `<div class="header"><div><h1>${esc(M.title)}</h1><p class="muted">${esc(M.one_liner)}</p><p class="muted">${esc(L.generated)}: ${esc(M.date)}${M.quick_mode?` · ${esc(L.quick_mode_note)}`:''}</p></div>
    <div style="text-align:right"><span class="badge ${verdictClass(V.label)}">${esc(V.label)}</span>${V.conditional_on?`<p class="muted" style="max-width:320px">${esc(L.conditional_on)}: ${esc(V.conditional_on)}</p>`:''}</div></div>`;
  if (V.council_warning) html += `<div class="banner">⚠ ${esc(V.council_warning)}</div>`;
  html += `<div class="toolbar"><button onclick="document.querySelectorAll('details').forEach(d=>d.open=true)">${esc(L.expand_all)}</button><button onclick="document.querySelectorAll('details').forEach(d=>d.open=false)">${esc(L.collapse_all)}</button></div>`;

  // --- verdict ---
  html += sec(L.verdict, `<p><strong>${esc(V.summary)}</strong></p>${V.arithmetic?`<p class="muted">${esc(V.arithmetic)}</p>`:''}
    <div class="kv"><b>${esc(L.biggest_risk)}</b><span>${esc(V.biggest_risk)}</span>${V.pivot_suggestion?`<b>${esc(L.pivot_suggestion)}</b><span>${esc(V.pivot_suggestion)}</span>`:''}</div>`);

  // --- scorecard ---
  const S = D.scorecard;
  html += sec(L.scorecard, `<div class="radar">${radar(S.dimensions)}<div style="flex:1;min-width:260px"><p><strong>${esc(L.weighted_total)}: ${esc(Number(S.total).toFixed(1))} / 5</strong></p>
    ${table([L.dimension,L.score,L.weight,L.confidence,L.owner,L.dissenters], S.dimensions.map(d=>[esc(d.name), `<span class="num">${esc(d.score)}${d.range?` <span class="tag">${esc(d.range)}</span>`:''}</span>`, esc(d.weight), conf(d.confidence), esc(d.owner), esc((d.dissenters||[]).join(', ')||'-')]))}</div></div>
    ${S.dimensions.map(d=>inner(`${esc(d.name)} - ${esc(d.score)}/5 ${conf(d.confidence)}`, `<p>${esc(d.justification)}</p><h4>${esc(L.evidence)}</h4>${li(d.evidence)}`)).join('')}`);

  // --- council ---
  const C = D.council;
  html += sec(L.council, `<h4>${esc(L.council_health)}</h4><p>${esc(C.health)}</p>${C.round2_held===false?`<p class="banner">${esc(L.round2_skipped)}</p>`:''}
    <h3>${esc(L.agreed)}</h3>${li(C.agreed)}
    <h3>${esc(L.disputed)}</h3>${(C.disputed||[]).map(d=>`<div class="cell" style="margin:8px 0"><b>${esc(d.topic)}</b>${(d.sides||[]).map(s=>`<p><strong>${esc((s.members||[]).join(', '))}:</strong> ${esc(s.argument)}</p>`).join('')}${d.moved_in_round2?`<p class="muted">${esc(L.round2)}: ${esc(d.moved_in_round2)}</p>`:''}</div>`).join('')||'<p class="muted">-</p>'}
    <h3>${esc(L.dissent)} <span class="tag">${esc((C.dissent.from||[]).join(', '))}</span></h3><div class="quote" style="white-space:pre-line">${esc(C.dissent.text)}</div>
    <h3>${esc(L.members)}</h3>${(C.members||[]).map(m=>inner(`${esc(m.name)} <span class="tag">${esc(L.round1)}: ${esc(m.position_r1)}</span>${m.position_r2?`<span class="tag">${esc(L.round2)}: ${esc(m.position_r2)}</span>`:''}`,
      `<h4>${esc(L.arguments)}</h4>${li(m.arguments)}${(m.scores||[]).length?table([L.dimension,L.score,L.confidence,''],m.scores.map(s=>[esc(s.dimension),esc(s.score),conf(s.confidence),esc(s.reason)])):''}<h4>${esc(L.change_my_mind)}</h4>${li(m.change_my_mind)}${m.round2_notes?`<h4>${esc(L.round2)}</h4><p style="white-space:pre-line">${esc(m.round2_notes)}</p>`:''}`)).join('')}`);

  // --- lean canvas ---
  const LC = D.lean_canvas, cells = [['c1','problem'],['c2','solution'],['c3','uvp'],['c4','unfair_advantage'],['c5','customer_segments'],['c6','key_metrics'],['c7','channels'],['c8','costs'],['c9','revenue']];
  const cn = {problem:'Problem',solution:'Solution',uvp:'Unique value proposition',unfair_advantage:'Unfair advantage',customer_segments:'Customer segments',key_metrics:'Key metrics',channels:'Channels',costs:'Cost structure',revenue:'Revenue streams'};
  html += sec(L.lean_canvas, `<div class="grid canvas">${cells.map(([c,k])=>`<div class="cell ${c}"><b>${esc((L.canvas||{})[k]||cn[k])}</b>${esc(LC[k])}</div>`).join('')}</div>
    <h3>${esc(L.assumptions)}</h3>${table(['#','',L.hypothesis,'',''],(D.assumptions||[]).map(a=>[esc(a.id),esc(a.risk_rank),esc(a.text),esc(a.category),esc(a.evidence_level)]))}`, false);

  // --- research ---
  const R = D.research;
  html += sec(L.research,
    inner(esc(L.problem), `${(R.problem.quotes||[]).length?`<h4>${esc(L.quotes)}</h4>${R.problem.quotes.map(q=>`<div class="quote">${esc(q.text)} ${q.url?link('↗',q.url):''}</div>`).join('')}`:''}${fco(R.problem)}`, true) +
    inner(esc(L.market), `<h4>${esc(L.sizing)}</h4>${table(['',L.score,L.method,L.sources],(R.market.sizing||[]).map(s=>[esc(s.level),esc(s.value),esc(s.method),(s.sources||[]).map(u=>link('↗',u)).join(' ')]))}<h4>${esc(L.regulation)}</h4>${table(['','',''],(R.market.regulation||[]).map(r=>[esc(r.rule),esc(r.requires),link('↗',r.url)]))}${fco(R.market)}`) +
    inner(esc(L.competition), `<h4>${esc(L.competitors)}</h4>${table(['','','',''],(R.competition.competitors||[]).map(c=>[link(c.name,c.url),esc(c.what),esc(c.pricing)+(c.segment?`<br><span class="muted">${esc(c.segment)}</span>`:''),`<span style="color:var(--nogo)">−</span> ${esc(c.weaknesses)}<br><span style="color:var(--go)">+</span> ${esc(c.strengths)}${c.last_activity?`<br><span class="muted">${esc(c.last_activity)}</span>`:''}`]))}
      <h4>${esc(L.graveyard)}</h4>${table(['','','',''],(R.competition.graveyard||[]).map(g=>[esc(g.name),esc(g.what),esc(g.when),esc(g.reason)]))}${R.competition.whitespace?`<h4>${esc(L.whitespace)}</h4><p>${esc(R.competition.whitespace)}</p>`:''}${fco(R.competition)}`) +
    inner(esc(L.business_model), `${R.business_model.unit_economics?`<p>${esc(R.business_model.unit_economics)}</p>`:''}${fco(R.business_model)}`) +
    inner(esc(L.distribution), `<h4>${esc(L.channels)}</h4>${table(['','','','','',''],(R.distribution.channels||[]).map(c=>[esc(c.channel),esc(c.user_has_access),esc(c.cac_or_cost),esc(c.time_to_signal),esc(c.autopilot_compatible),esc(c.notes)]))}${R.distribution.first_channel_to_test?`<p><strong>→ ${esc(R.distribution.first_channel_to_test)}</strong></p>`:''}${fco(R.distribution)}`)
  );

  // --- fits ---
  const SP = D.side_project_fit, AP = D.autopilot_fit;
  html += sec(L.side_project_fit + ` - ${esc(SP.score)}/5`, `<p>${esc(SP.summary)}</p>${table(['','',L.weight],(SP.factors||[]).map(f=>[esc(f.name),esc(f.assessment),esc(f.weight)]))}`);
  html += sec(L.autopilot_fit + ` - ${esc(AP.score)}/5`, `<p><strong>${esc(L.hours_per_week)}: ${esc(AP.hours_per_week_total)}</strong></p>${table(['','h',''],(AP.layers||[]).map(l=>[esc(l.name),esc(l.hours),esc(l.notes)]))}
    <h3>${esc(L.killers)}</h3>${table(['','',L.fix],(AP.killers||[]).map(k=>[esc(k.killer),`<span class="tag">${esc(k.fix_type)}</span>`,esc(k.fix)]))}`);

  // --- risks ---
  html += sec(L.risks, table(['',L.likelihood,L.impact,L.warning_sign,L.mitigation,''],(D.risks||[]).map(r=>[esc(r.risk),esc(r.likelihood),esc(r.impact),esc(r.warning_sign),esc(r.mitigation),esc(r.mitigable)])));

  // --- experiments + thresholds ---
  html += sec(L.experiments, table(['#',L.hypothesis,L.test,L.metric,L.pass,L.fail,L.cost,L.duration,L.owner],(D.experiments||[]).map(e=>[esc(e.n),esc(e.hypothesis),esc(e.test),esc(e.metric),esc(e.pass),esc(e.fail),esc(e.cost),esc(e.duration),esc(e.owner)])));
  const T = D.thresholds;
  html += sec(L.thresholds, `<table class="thr"><tbody><tr class="go"><td>Go</td><td>${esc(T.go)}</td></tr><tr class="pivot"><td>Pivot</td><td>${esc(T.pivot)}</td></tr><tr class="nogo"><td>No-Go</td><td>${esc(T.no_go)}</td></tr></tbody></table>`);

  // --- appendix ---
  const A = D.appendix;
  html += sec(L.appendix, `<h3>${esc(L.closing_note)}</h3><p>${esc(A.closing_note)}</p><h3>${esc(L.data_gaps)}</h3>${li(A.data_gaps)}<h3>${esc(L.methodology)}</h3><p style="white-space:pre-line">${esc(A.methodology)}</p>
    <h3>${esc(L.sources)}</h3>${(A.sources||[]).length?'<ol>'+A.sources.map(s=>`<li>${link(s.title||s.url,s.url)} ${s.date?`<span class="muted">(${esc(s.date)})</span>`:''}${s.outdated?`<span class="tag">${esc(L.outdated)}</span>`:''}</li>`).join('')+'</ol>':'<p class="muted">-</p>'}
    `, false);

  html += `<footer>idea-validator · ${esc(M.date)}</footer>`;
  document.getElementById('app').innerHTML = html;
})();
</script>
</body>
</html>
